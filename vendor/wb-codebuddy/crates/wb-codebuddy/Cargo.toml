[package]
name = "wb-codebuddy"
version = "0.1.0"
edition = "2021"
description = "CodeBuddy CLI account manager"

[[bin]]
name = "wb-codebuddy"
path = "src/main.rs"

[dependencies]
wb-codebuddy-core = { path = "../wb-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
chrono = "0.4"
libc = "0.2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
