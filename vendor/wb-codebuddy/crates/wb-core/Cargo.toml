[package]
name = "wb-codebuddy-core"
version = "0.1.0"
edition = "2021"
description = "CodeBuddy CLI account, OAuth, switch, backup, and token statistics core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
base64 = "0.22"
